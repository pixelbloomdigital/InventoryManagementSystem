spring.application.name=inventory-service
server.port=9093

spring.datasource.url=jdbc:mysql://mysql-inventory:3306/inventorydb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

# Enable Springdoc OpenAPI JSON endpoint
springdoc.api-docs.enabled=true

# Enable Swagger UI
springdoc.swagger-ui.enabled=true
spring.cloud.compatibility-verifier.enabled=false


eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
eureka.instance.prefer-ip-address=true

logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html

# Enable or disable specific features
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# Security (Spring Security required)
# Only allow certain roles to access actuator endpoints
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.roles=ADMIN




#  Actuator exposure   Metrics tag
management.metrics.tags.application=inventory-service

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans


