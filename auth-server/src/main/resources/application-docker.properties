spring.application.name=auth-server
server.port=2000

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://mysql-auth:3306/imsauthdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=your-secret-key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Enable detailed Spring Security logs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.filter=DEBUG

logging.level.org.hibernate.SQL=DEBUG


#  Actuator exposure   Metrics tag
management.metrics.tags.application=inventory-service

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.enabled=true

spring.cloud.compatibility-verifier.enabled=false

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.org.springframework.validation=TRACE

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


