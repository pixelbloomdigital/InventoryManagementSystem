spring.application.name=api-gateway
server.port=9999
# ===============================
# Spring Cloud Gateway Routes for auth-server -2000
# ===============================

# Orders route (FIXED)
spring.cloud.gateway.routes[0].id=orders-service
spring.cloud.gateway.routes[0].uri=http://localhost:9095
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/admin/orders/**,/api/auth/user/orders/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/auth/(admin|user)/orders/(?<segment>.*), /api/orders/${segment}

# Inventory route (FIXED)
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=http://localhost:9093
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/admin/inventory/**,/api/auth/user/inventory/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/auth/(admin|user)/inventory/(?<segment>.*), /api/inventory/${segment}

# Products service (both admin and user)
spring.cloud.gateway.routes[2].id=products-service
spring.cloud.gateway.routes[2].uri=http://localhost:9094
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/admin/products/**,/api/auth/user/products/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/auth/(admin|user)/products/(?<segment>.*), /api/products/${segment}

# Payment service (both admin and user)
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=http://localhost:9096
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/admin/payments/**,/api/auth/user/payments/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/auth/(admin|user)/payments/(?<segment>.*), /api/payments/${segment}

# Shipping service (both admin and user)
spring.cloud.gateway.routes[4].id=shipping-service
spring.cloud.gateway.routes[4].uri=http://localhost:9097
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/admin/shipping/**,/api/auth/user/shipping/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/auth/(admin|user)/shipping/(?<segment>.*), /api/shipping/${segment}

# Auth service route
spring.cloud.gateway.routes[5].id=auth-server
spring.cloud.gateway.routes[5].uri=http://localhost:2000
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/register,/api/auth/login,/api/auth/token,/api/auth/validate,/api/auth/createAdmin,/api/auth/admin,/api/auth/customer/**,/api/auth/admin/**

# Direct inventory access (for Feign clients)
spring.cloud.gateway.routes[6].id=inventory-direct
spring.cloud.gateway.routes[6].uri=http://localhost:9093
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/inventory/**

# Direct payment access (for service-to-service for feign calls)
spring.cloud.gateway.routes[7].id=payment-direct
spring.cloud.gateway.routes[7].uri=http://localhost:9096
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/payments/**

# Direct shipping access (for service-to-service for feign calls)
spring.cloud.gateway.routes[8].id=shipping-direct
spring.cloud.gateway.routes[8].uri=http://localhost:9097
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/shipping/**

# Direct shipping access (for service-to-service for feign calls)
spring.cloud.gateway.routes[9].id=shipping-direct
spring.cloud.gateway.routes[9].uri=http://localhost:9094
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/products/**

# Customer service direct access
spring.cloud.gateway.routes[10].id=customer-direct
spring.cloud.gateway.routes[10].uri=http://localhost:2000
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/customer/**

eureka.client.enabled=false



# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/






# Enable detailed Spring Security logs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.cloud.compatibility-verifier.enabled=false




