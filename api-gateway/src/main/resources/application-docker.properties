# ===============================
# Application basics
# ===============================
spring.application.name=api-gateway
server.port=9999

# ===============================
# Eureka configuration
# ===============================
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
eureka.instance.prefer-ip-address=true

# ===============================
# Admin-only routes
# ===============================

spring.cloud.gateway.routes[0].id=admin-inventory
spring.cloud.gateway.routes[0].uri=lb:// inventory-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/admin/inventory/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[0].filters[1]=RoleBasedFilter
spring.cloud.gateway.routes[0].filters[2]=RewritePath=/api/auth/admin/inventory/(?<segment>.*),/api/inventory/${segment}

spring.cloud.gateway.routes[1].id=admin-orders
spring.cloud.gateway.routes[1].uri=lb://  orders-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/admin/orders/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[1].filters[1]=RoleBasedFilter
spring.cloud.gateway.routes[1].filters[2]=RewritePath=/api/auth/admin/orders/(?<segment>.*),/api/orders/${segment}

spring.cloud.gateway.routes[2].id=admin-shipping
spring.cloud.gateway.routes[2].uri=lb://shipping-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/admin/shipping/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[2].filters[1]=RoleBasedFilter
spring.cloud.gateway.routes[2].filters[2]=RewritePath=/api/auth/admin/shipping/(?<segment>.*),/api/shipping/${segment}

# ===============================
# User + Admin routes
# ===============================

spring.cloud.gateway.routes[3].id=user-inventory
spring.cloud.gateway.routes[3].uri=lb://inventory-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/user/inventory/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[3].filters[1]=RoleBasedFilter
spring.cloud.gateway.routes[3].filters[2]=RewritePath=/api/auth/user/inventory/(?<segment>.*),/api/inventory/${segment}

spring.cloud.gateway.routes[4].id=user-shipping
spring.cloud.gateway.routes[4].uri=lb://shipping-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/user/shipping/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=RoleBasedFilter
spring.cloud.gateway.routes[4].filters[2]=RewritePath=/api/auth/user/shipping/(?<segment>.*),/api/shipping/${segment}

# ===============================
# Auth service (no JWT filter)
# ===============================

spring.cloud.gateway.routes[5].id=auth-service
spring.cloud.gateway.routes[5].uri=lb://auth-server
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/login,/api/auth/register,/api/auth/customer/**

# ===============================
# Internal inventory (secured)
# ===============================

spring.cloud.gateway.routes[6].id=internal-inventory
spring.cloud.gateway.routes[6].uri=lb://inventory-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthenticationFilter

# ===============================
# Actuator / Metrics
# ===============================

management.metrics.tags.application=api-gateway
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.enabled=true

# ===============================
# Tracing
# ===============================

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# ===============================
# Spring Cloud compatibility
# ===============================

spring.cloud.compatibility-verifier.enabled=false
