spring.application.name=orders-service
server.port=9095

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
eureka.instance.prefer-ip-address=true


spring.datasource.url=jdbc:mysql://mysql-orders:3306/ordersdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.http.converter.json=DEBUG


# ===============================
# Kafka Common
# ===============================
spring.kafka.bootstrap-servers=kafka:9092

# ===============================
# Kafka Producer Configuration
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Delivery guarantees
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Optional (performance tuning)
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.buffer-memory=33554432

# ===============================
# Topic Names (Centralized)
# ===============================
kafka.topic.domain-events=domain-events

kafka.topic.email-events=order-email-events


# Add to existing application-docker.properties
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest


# Add Kafka topic for invoice
kafka.topic.invoice-events=invoice-events

# Disable static resource handling
spring.web.resources.add-mappings=false


# Enable detailed Spring Security logs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.filter=DEBUG


#  Actuator exposure   Metrics tag
management.metrics.tags.application=inventory-service

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.cloud.compatibility-verifier.enabled=false


management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans



